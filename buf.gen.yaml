# buf generates the Swift client and the HTML API reference.  Java/Mutiny stubs come from
# Quarkus's generate-code in the Maven build (buf's remote Java plugins don't emit Quarkus
# Mutiny stubs), which reads the java_* options declared in each .proto file.
# Docs: https://buf.build/docs/configuration/v2/buf-gen-yaml
version: v2
managed:
  enabled: true
  disable:
    # The files declare java_package themselves (com.villagecompute.wiretuner.<package>) so that
    # Quarkus, which does not run through buf, and buf see the same value.
    - file_option: java_package
plugins:
  # swift-protobuf messages; keep in lock-step with the client's SwiftProtobuf package version
  # (the plugin's version is the swift-protobuf release it emits for).  Pinned so that
  # `buf generate` is reproducible and the CI drift check compares like with like.
  - remote: buf.build/apple/swift:v1.38.1
    out: client/Packages/WTProto/Sources/WTProto/Generated
    opt:
      - Visibility=Public
      - FileNaming=PathToUnderscores
  # grpc-swift 2 async/await client stubs (PROTO-004, docs/spec/decisions.adoc D-014).  The BSR
  # plugin buf.build/grpc/swift is a grpc-swift 1.x generator (v1.27.6, `import GRPC`), so the
  # v2 generator is built from grpc/grpc-swift-protobuf by tools/proto/install-plugins.sh at
  # the version WTProto's Package.resolved pins (2.4.1) and run as a local plugin.  Client only:
  # the server is Quarkus.  Emits <file>.grpc.swift beside the swift-protobuf <file>.pb.swift.
  - local: tools/bin/protoc-gen-grpc-swift-2
    out: client/Packages/WTProto/Sources/WTProto/Generated
    opt:
      - Visibility=Public
      - Client=true
      - Server=false
      - FileNaming=PathToUnderscores
  # merge tables + client-side validators generated from wt.crdt and buf.validate options
  # (strategy: all -- the plugin must see every file at once to build one table).
  - local: tools/bin/protoc-gen-wtcrdt
    strategy: all
    out: .
    opt:
      - swift_out=client/Packages/WTCRDT/Sources/WTCRDTSchema/Generated
      - java_out=server/wt-crdt/target/generated-sources/wtcrdt
  # static API reference from proto comments; CI uploads it as an artifact (proto workflow);
  # the directory is gitignored.
  - remote: buf.build/community/pseudomuto-doc:v1.5.1
    out: proto/gen/docs
    opt:
      - html,index.html
