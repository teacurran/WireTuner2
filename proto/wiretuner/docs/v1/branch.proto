// proto/wiretuner/docs/v1/branch.proto
//
// Branches (docs/_includes/collaboration/branches.adoc, "Data model"): a branch is an
// ordinary document -- its own change log, snapshots, replicas and presence -- forked from a
// parent at a server_seq and recorded in the `branch` row.  Merging is a server-side replay of
// the branch's changes into the parent with a client-reviewed exclusion list (decisions.adoc
// D-036); branches do not nest.  The document schema is unchanged.  Events about branches
// reach open sessions as wiretuner.sync.v1.BranchEvent.
syntax = "proto3";

package wiretuner.docs.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "wiretuner/doc/v1/change.proto";
import "wiretuner/doc/v1/common.proto";

option java_multiple_files = true;
option java_package = "com.villagecompute.wiretuner.docs.v1";
option optimize_for = SPEED;

// Create, list, merge and retire branches of a document.  A branch inherits its parent's
// members and roles; editor or owner on the parent is needed to create, rename, merge,
// archive or delete a branch, any role to list and get.  A parent the caller cannot see, or a
// branch id that is not a branch, answers NOT_FOUND with reason DOCUMENT_NOT_FOUND.
service BranchService {
  // Create the branch document from the parent's state at `fork_server_seq` and ingest
  // `initial_changes` (the offline-created case).  Idempotent by `branch_document_id`.  A
  // branch of a branch is FAILED_PRECONDITION.
  rpc CreateBranch(CreateBranchRequest) returns (CreateBranchResponse);
  // The parent's branches, or with `space_id` those of every document of a space, newest first.
  rpc ListBranches(ListBranchesRequest) returns (ListBranchesResponse);
  // One branch.
  rpc GetBranch(GetBranchRequest) returns (GetBranchResponse);
  // Rename a branch.
  rpc RenameBranch(RenameBranchRequest) returns (RenameBranchResponse);
  // Replay the branch's changes since its last merge point into the parent, skipping the
  // nodes the review excluded, then append the client's re-assertions.  Refused with
  // FAILED_PRECONDITION and reason MERGE_STALE when the parent advanced past
  // `reviewed_parent_seq` by changes touching excluded or re-asserted nodes.  The branch
  // becomes MERGED unless `keep_open`.
  rpc MergeBranch(MergeBranchRequest) returns (MergeBranchResponse);
  // Archive a branch (hidden from the popup, still openable) or make it active again.  A
  // MERGED branch can be reopened as ACTIVE; a second merge replays only the changes after the
  // first.
  rpc SetBranchState(SetBranchStateRequest) returns (SetBranchStateResponse);
  // Trash the branch document; it is restorable for 30 days through DocumentService.Restore
  // like any document.  Idempotent.
  rpc DeleteBranch(DeleteBranchRequest) returns (DeleteBranchResponse);
}

// Where a branch is in its life.
enum BranchState {
  // Not set.
  BRANCH_STATE_UNSPECIFIED = 0;
  // Open for work; listed in the branch popup.
  BRANCH_STATE_ACTIVE = 1;
  // Set aside; hidden from the popup unless asked for, still openable.
  BRANCH_STATE_ARCHIVED = 2;
  // Merged into the parent; read-only until reopened.
  BRANCH_STATE_MERGED = 3;
}

// A branch as the popup shows it.
message Branch {
  // The branch is a document; this is its id.
  string branch_document_id = 1 [(buf.validate.field).string.uuid = true];
  // The document it was forked from.
  string parent_document_id = 2 [(buf.validate.field).string.uuid = true];
  // The display name.
  string name = 3 [(buf.validate.field).string.max_len = 256];
  // The parent's server_seq the branch was forked from.
  uint64 fork_server_seq = 4;
  // The branch's own server_seq up to which it has been merged into the parent; 0 = never.  A
  // second merge replays only branch changes after it.
  uint64 merged_branch_seq = 5;
  // The parent's server_seq at which the last merge landed; 0 = never.
  uint64 merged_parent_seq = 6;
  // The state.
  BranchState state = 7 [(buf.validate.field).enum.defined_only = true];
  // The account that created it.
  string created_by_account_id = 8 [(buf.validate.field).string.uuid = true];
  // When it was created.
  google.protobuf.Timestamp created_at = 9;
  // Who last changed the branch, for the popup.
  string last_author_account_id = 10 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // Display name of that person.
  string last_author_display_name = 11 [(buf.validate.field).string.max_len = 256];
  // When the branch last changed.
  google.protobuf.Timestamp last_change_at = 12;
  // The branch's head server_seq.
  uint64 head_seq = 13;
}

// Creates a branch.
message CreateBranchRequest {
  // The document to branch from.
  string parent_document_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // The client-generated UUIDv7 of the branch document (the idempotency key).
  string branch_document_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      uuid: true
      pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
    }
  ];
  // The display name.
  string name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  // The parent head the client had applied when it forked; the server builds the branch from
  // the parent's snapshot at or before it plus the tail to exactly this seq.  0 = the parent's
  // head at the time of the call.
  uint64 fork_server_seq = 4;
  // Changes already made on the branch locally (the offline case).  The replicas they carry
  // are bound to the branch document and their highest seqs recorded as those replicas'
  // baseline, so the client's session on the branch continues from the next seq.  Larger sets
  // stream through SyncService.PushChanges after creation instead.
  repeated wiretuner.doc.v1.Change initial_changes = 5 [(buf.validate.field).repeated.max_items = 1000];
}

// The created branch.
message CreateBranchResponse {
  // The branch.
  Branch branch = 1;
}

// Lists a document's branches, or every branch of a space's documents.
message ListBranchesRequest {
  option (buf.validate.message).cel = {
    id: "list_branches.parent_or_space"
    message: "exactly one of parent_document_id and space_id is required"
    expression: "(this.parent_document_id != '') != (this.space_id != '')"
  };
  // The parent document; empty when `space_id` is given.
  string parent_document_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // Whether to include archived and merged branches, which are otherwise omitted.
  bool include_archived = 2;
  // Opaque cursor from a previous response; empty for the first page.
  string cursor = 3 [(buf.validate.field).string.max_len = 1024];
  // Branches per page; 0 selects the server's default, at most 50.
  uint32 page_size = 4 [(buf.validate.field).uint32.lte = 50];
  // Instead of a parent: the branches of every live document of this space (the caller's
  // account id or a team id) that the caller can see, for the library window's nesting and its
  // Archived list (COLLAB-016).  Any member of the space.  Newest first, like a parent's list.
  string space_id = 5 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

// One page of branches.
message ListBranchesResponse {
  // The branches, active first, then most recently changed first.
  repeated Branch branches = 1;
  // Cursor for the next page; empty when this is the last page.
  string next_cursor = 2;
}

// Fetches one branch.
message GetBranchRequest {
  // The branch document.
  string branch_document_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

// The branch.
message GetBranchResponse {
  // The branch.
  Branch branch = 1;
}

// Renames a branch.
message RenameBranchRequest {
  // The branch document.
  string branch_document_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // The new name.
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
}

// The branch after the rename.
message RenameBranchResponse {
  // The branch.
  Branch branch = 1;
}

// Merges a branch into its parent.
message MergeBranchRequest {
  // The branch document.
  string branch_document_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // The parent head the client reviewed against.  The server refuses (MERGE_STALE) if the
  // parent has advanced past it by changes touching excluded or re-asserted nodes, so the
  // review is never applied to a state the user did not see.
  uint64 reviewed_parent_seq = 2;
  // Nodes for which the user chose "Use main": their branch ops are skipped in the replay.
  repeated wiretuner.doc.v1.OpId excluded_nodes = 3 [(buf.validate.field).repeated.max_items = 10000];
  // Re-assertions the review produced ("Use branch", "Keep both copies", "Restore"), as
  // ordinary changes from the client's parent replica, appended after the replay.
  repeated wiretuner.doc.v1.Change resolutions = 4 [(buf.validate.field).repeated.max_items = 1000];
  // Leave the branch ACTIVE instead of MERGED.
  bool keep_open = 5;
}

// What the merge did.
message MergeBranchResponse {
  // The branch after the merge.
  Branch branch = 1;
  // The first server_seq the merge occupies in the parent's log.
  uint64 first_parent_seq = 2;
  // The last server_seq the merge occupies in the parent's log.
  uint64 last_parent_seq = 3;
  // Branch ops that were no-ops in the parent because they named nodes compacted out of the
  // parent since the fork (decisions.adoc D-036); shown in the toast.
  uint32 dropped_ops = 4;
}

// Archives or reactivates a branch.
message SetBranchStateRequest {
  // The branch document.
  string branch_document_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // ACTIVE or ARCHIVED; MERGED is set by MergeBranch only.
  BranchState state = 2 [(buf.validate.field).enum = {
    defined_only: true
    in: [
      1,
      2
    ]
  }];
}

// The branch after the change.
message SetBranchStateResponse {
  // The branch.
  Branch branch = 1;
}

// Trashes a branch.
message DeleteBranchRequest {
  // The branch document.
  string branch_document_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

// Empty; the branch document is in the trash.
message DeleteBranchResponse {}
