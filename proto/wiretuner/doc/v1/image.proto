// proto/wiretuner/doc/v1/image.proto
//
// The `image` node kind (docs/_includes/imported/importing.adoc, IMG-001; the fields are
// edited on bitmaps.adoc, cropping-bitmaps.adoc and cms/image-color.adoc).  The pixels live in
// a content-addressed blob; the node carries what the renderer needs before the blob arrives
// (dimensions, mode) so a placeholder is the right size on every replica.  Nothing about upload
// or download state is in the document.
//
// ImageProps field numbers (IMG-001): 1 common; 2-19 IMG (importing.adoc, bitmaps.adoc,
// cropping-bitmaps.adoc; 11 `color` is cms/image-color.adoc's message); 20- free, an epic takes
// the next block of ten and adds it here.
syntax = "proto3";

package wiretuner.doc.v1;

import "buf/validate/validate.proto";
import "wiretuner/doc/v1/color_management.proto";
import "wiretuner/doc/v1/common.proto";
import "wt/crdt/options.proto";

option java_multiple_files = true;
option java_package = "com.villagecompute.wiretuner.doc.v1";
option optimize_for = SPEED;

// The pixel model of an image.
enum ColorMode {
  // Unknown; renders as RGB.
  COLOR_MODE_UNSPECIFIED = 0;
  // One bit per pixel.
  COLOR_MODE_BILEVEL = 1;
  // Grayscale.
  COLOR_MODE_GRAYSCALE = 2;
  // Palette (GIF, 8-bit PNG); tints and Transparent are not offered.
  COLOR_MODE_INDEXED = 3;
  // RGB.
  COLOR_MODE_RGB = 4;
  // CMYK.
  COLOR_MODE_CMYK = 5;
}

// The pixel source.  ATOMIC wherever used: dimensions, mode and depth describe this blob, so a
// replacement writes all of them in one register; the width of one replacement with the hash of
// another would describe a picture nobody has.
message PixelSource {
  // SHA-256 of the encoded file (32 bytes): the blob's content address.
  bytes blob_sha256 = 1 [(buf.validate.field).bytes.len = 32];
  // UTI of the stored encoding: public.png, public.tiff, public.jpeg, ...
  string format = 2 [(buf.validate.field).string.max_len = 128];
  // Width in pixels, above 0.
  int32 pixel_width = 3 [(buf.validate.field).int32.gt = 0];
  // Height in pixels, above 0.
  int32 pixel_height = 4 [(buf.validate.field).int32.gt = 0];
  // Pixel model.
  ColorMode mode = 5 [(buf.validate.field).enum.defined_only = true];
  // Bits per channel: 1, 8 or 16.
  int32 bits_per_channel = 6 [(buf.validate.field).int32 = {
    in: [
      1,
      8,
      16
    ]
  }];
  // The encoded file carries an alpha channel.
  bool has_alpha = 7;
}

// Grayscale ramp presets (Object panel).
enum GrayRampPreset {
  // Reads as NORMAL.
  GRAY_RAMP_PRESET_UNSPECIFIED = 0;
  // Identity.
  GRAY_RAMP_PRESET_NORMAL = 1;
  // Inverted.
  GRAY_RAMP_PRESET_INVERTED = 2;
  // Lightened.
  GRAY_RAMP_PRESET_LIGHTEN = 3;
  // Darkened.
  GRAY_RAMP_PRESET_DARKEN = 4;
  // Edited by hand.
  GRAY_RAMP_PRESET_CUSTOM = 5;
}

// A grayscale ramp remaps the gray levels of a bilevel or grayscale image.  ATOMIC wherever
// used: the three values describe one curve.
message GrayRamp {
  // The preset, or CUSTOM when edited by hand.
  GrayRampPreset preset = 1 [(buf.validate.field).enum.defined_only = true];
  // Lightness, -100 .. 100.
  int32 lightness = 2 [(buf.validate.field).int32 = {
    gte: -100
    lte: 100
  }];
  // Contrast, -100 .. 100.
  int32 contrast = 3 [(buf.validate.field).int32 = {
    gte: -100
    lte: 100
  }];
}

// NodeProps.kind case `image` (IMG block): an imported bitmap.  STRUCT.  The image's natural
// size is its pixel dimensions at `dpi_x`/`dpi_y`; CommonProps.transform scales, rotates and
// skews it.
message ImageProps {
  // Name, note, transform and the other shared registers.
  CommonProps common = 1;
  // The pixels.  ATOMIC.
  PixelSource pixels = 2 [(wt.crdt.field).merge = MERGE_ATOMIC];
  // File name at import; shown in the Object panel and on placeholders.
  string source_name = 3 [(buf.validate.field).string.max_len = 256];
  // Horizontal stored resolution in pixels per inch; 0 (never set) reads as 72.
  double dpi_x = 4 [
    (buf.validate.field).double.gt = 0,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // Vertical stored resolution in pixels per inch; 0 (never set) reads as 72.
  double dpi_y = 5 [
    (buf.validate.field).double.gt = 0,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // Object panel "Display alpha channel".  Ignored when pixels.has_alpha is false.
  bool display_alpha = 6;
  // Object panel "Transparent": white pixels of a bilevel or grayscale image are clear.
  bool transparent_background = 7;
  // Object panel "Edit grayscale ramp".  Unset reads as NORMAL.  ATOMIC.
  GrayRamp ramp = 8 [(wt.crdt.field).merge = MERGE_ATOMIC];
  // Color applied to the dark pixels of a bilevel or grayscale image, shown as the image's one
  // fill row.  ATOMIC; a swatch reference caches its color, so a deleted swatch keeps the last
  // color.
  ColorRef tint = 9 [(wt.crdt.field).merge = MERGE_ATOMIC];
  // Non-destructive crop in unit image space (0 .. 1 of the natural size, y down).  Unset =
  // uncropped.  ATOMIC: a rectangle's edges are one gesture.
  Rect crop = 10 [(wt.crdt.field).merge = MERGE_ATOMIC];
  // Source profile and rendering intent (cms/image-color.adoc).  STRUCT.
  ImageColorSettings color = 11;
  // The `asset` node (under 0:9) holding the link record; unset for pasted and generated
  // images.  Dangling reads as unset (document/linking-embedding.adoc).
  NodeRef source = 12 [(wt.crdt.field).on_dangling = REF_FALLBACK_UNSET];
}
