// proto/wiretuner/doc/v1/node.proto
//
// The node tree (docs/spec/crdt-model.adoc, "The node tree").  Everything in a document is a
// node: pages, layers, paths, groups, text blocks, swatches, styles, symbols.  Each node has an
// immutable kind (the NodeProps oneof case), a mutable parent, a position among its siblings,
// a `deleted` flag and typed properties.  Adding a kind is one line in NodeProps.kind plus the
// new file; nothing else in the engines changes.
//
// NodeProps.kind field-number blocks, one per epic (docs/spec/api-conventions.adoc,
// "Packages").  A task takes the next free number in its epic's block and records the case
// here; blocks are never renumbered and a case is never removed.
//
//   Block     Epic    Cases so far
//   1-19      DOC     1 document, 2 settings, 3 page, 4 master_page, 5 asset
//   20-49     DRAW    20 path, 21 rect, 22 ellipse, 23 polygon, 24 chart, 25 connector,
//                     26 hose_set (DRAW-038)
//   50-69     OBJ     50 group
//   70-79     COLOR   70 swatch, 71 gradient_swatch (ATTR-029)
//   80-99     ATTR    80 brush
//   100-129   FX      100 blend, 101 extrude, 102 envelope, 103 perspective
//   130-149   TYPE    130 text (text styles are `style` nodes of kind PARAGRAPH/CHARACTER)
//   150-169   LIB     150 layer, 151 symbol, 152 symbol_folder, 153 instance, 154 style
//   170-189   IMG     170 image, 171 placed_file
//   190-209   WEB     190 svg_animation
//   210-219   COLLAB  210 comment_thread
//   220-239   FONT    220 glyph
//   240-259   DATA    240 barcode, 241 script
//   260-279   BASIC   260 custom_view (BASIC-014)
//   280-299   CMS     280 profile_asset (CMS-010)
//   300-      free; a new epic takes the next block of 20 and adds a row here.
syntax = "proto3";

package wiretuner.doc.v1;

import "buf/validate/validate.proto";
import "wiretuner/doc/v1/asset.proto";
import "wiretuner/doc/v1/barcode.proto";
import "wiretuner/doc/v1/blend.proto";
import "wiretuner/doc/v1/chart.proto";
import "wiretuner/doc/v1/color.proto";
import "wiretuner/doc/v1/color_management.proto";
import "wiretuner/doc/v1/comments.proto";
import "wiretuner/doc/v1/common.proto";
import "wiretuner/doc/v1/connector.proto";
import "wiretuner/doc/v1/document.proto";
import "wiretuner/doc/v1/envelope.proto";
import "wiretuner/doc/v1/extrude.proto";
import "wiretuner/doc/v1/glyph.proto";
import "wiretuner/doc/v1/group.proto";
import "wiretuner/doc/v1/hose.proto";
import "wiretuner/doc/v1/image.proto";
import "wiretuner/doc/v1/layer.proto";
import "wiretuner/doc/v1/path.proto";
import "wiretuner/doc/v1/perspective.proto";
import "wiretuner/doc/v1/placed_file.proto";
import "wiretuner/doc/v1/script.proto";
import "wiretuner/doc/v1/shape.proto";
import "wiretuner/doc/v1/stroke.proto";
import "wiretuner/doc/v1/style.proto";
import "wiretuner/doc/v1/svg_animation.proto";
import "wiretuner/doc/v1/symbol.proto";
import "wiretuner/doc/v1/text.proto";
import "wiretuner/doc/v1/view.proto";

option java_multiple_files = true;
option java_package = "com.villagecompute.wiretuner.doc.v1";
option optimize_for = SPEED;

// The counters of the well-known nodes: `OpId(counter = <value>, replica = 0)`.  They exist in
// every document without being created, have no props (the NodeProps oneof is unset) and cannot
// be moved or deleted; an op that tries is a deterministic no-op.  Counters 13-15 are reserved
// for future collections.  The zero value is the document root, not "unspecified"
// (buf.yaml carries the lint exception).
enum WellKnown {
  // 0:0, the root of the tree.  Its props are DocumentProps.
  WELL_KNOWN_DOCUMENT = 0;
  // 0:1, the settings node: units, default attributes, print and export settings
  // (SettingsProps).
  WELL_KNOWN_SETTINGS = 1;
  // 0:2, the pages collection; children are `page` nodes in page order.
  WELL_KNOWN_PAGES = 2;
  // 0:3, the master pages collection; children are `master_page` nodes.
  WELL_KNOWN_MASTERS = 3;
  // 0:4, the layers collection; children are `layer` nodes in stacking order, bottom first.
  WELL_KNOWN_LAYERS = 4;
  // 0:5, the swatches collection: color, tint and gradient swatches in list order.
  WELL_KNOWN_SWATCHES = 5;
  // 0:6, the styles collection: graphic and text styles.
  WELL_KNOWN_STYLES = 6;
  // 0:7, the symbols collection (Library panel): symbols, symbol folders and hose sets; each
  // symbol's and hose set's children are its objects.
  WELL_KNOWN_SYMBOLS = 7;
  // 0:8, the brushes collection.
  WELL_KNOWN_BRUSHES = 8;
  // 0:9, the assets collection: image, font, embedded file and script blob references.
  WELL_KNOWN_ASSETS = 9;
  // 0:10, reserved.  Deleted nodes stay in place under their parent with `deleted = true`;
  // nothing is ever moved here.
  WELL_KNOWN_TRASH = 10;
  // 0:11, the glyphs collection (typeface documents only; a glyph is a canvas like a page).
  // Empty in an illustration document.
  WELL_KNOWN_GLYPHS = 11;
  // 0:12, the comments collection; children are `comment_thread` nodes.  Conversation, not
  // artwork: never rendered or exported by default.
  WELL_KNOWN_COMMENTS = 12;
}

// A node as a plain value: its identity, place in the tree, deletion flag and properties,
// without the per-register OpIds the merge engines keep (those are in snapshot.proto's
// NodeState).  The shape exporters, the clipboard and tests exchange.
message Node {
  // The node's id: the OpId of the CreateNode that made it, or a WellKnown counter with
  // replica 0.
  OpId id = 1 [(buf.validate.field).required = true];
  // The parent's id.  Unset only for the root 0:0.
  OpId parent = 2;
  // Fractional index among the parent's children, compared bytewise; ties break by node id.
  // Empty only for the root and the well-known collections.
  bytes position = 3 [(buf.validate.field).bytes.max_len = 1024];
  // A deleted node keeps its properties, children and history; it is not rendered or
  // selectable, and edits to it still apply so restoring it restores them too.
  bool deleted = 4;
  // The kind and its properties.
  NodeProps props = 5;
}

// The typed properties of a node.  The set `kind` case is the node's kind, fixed at creation;
// each case is a `<Kind>Props` message whose first field is `CommonProps common = 1`.  A
// SetFields op carries a sparse NodeProps holding only the registers it writes, addressed by
// FieldPath from this message.  Numbers are allocated per epic by the table at the top of
// this file.
message NodeProps {
  // The node's kind and its properties.  Unset for the well-known collection nodes 0:2-0:12.
  oneof kind {
    // The root node 0:0 (DOC block).
    DocumentProps document = 1;
    // The settings node 0:1 (DOC block).
    SettingsProps settings = 2;
    // A page under 0:2 (DOC block).
    PageProps page = 3;
    // A master page under 0:3 (DOC block).
    MasterPageProps master_page = 4;
    // An imported file's blob and link record under 0:9 (DOC block, asset.proto).
    AssetProps asset = 5;
    // A vector path (DRAW block, path.proto).
    PathProps path = 20;
    // A live rectangle (DRAW block, shape.proto).
    RectProps rect = 21;
    // A live ellipse (DRAW block, shape.proto).
    EllipseProps ellipse = 22;
    // A live polygon or star (DRAW block, shape.proto).
    PolygonProps polygon = 23;
    // A chart regenerated from its data (DRAW block, chart.proto).
    ChartProps chart = 24;
    // A connector line joining two objects (DRAW block, connector.proto).
    ConnectorProps connector = 25;
    // A Graphic Hose set under 0:7, its children the hose's objects (DRAW block, hose.proto).
    HoseSetProps hose_set = 26;
    // A group of objects (OBJ block).
    GroupProps group = 50;
    // A color or tint swatch under 0:5 (COLOR block, color.proto).
    SwatchProps swatch = 70;
    // A gradient swatch under 0:5 (COLOR block, color.proto).
    GradientSwatchProps gradient_swatch = 71;
    // A brush under 0:8 (ATTR block, stroke.proto).
    BrushProps brush = 80;
    // A blend of key objects (FX block, blend.proto).
    BlendProps blend = 100;
    // An extrusion wrapping one flat shape (FX block, extrude.proto).
    ExtrudeProps extrude = 101;
    // An envelope warping its contents (FX block, envelope.proto).
    EnvelopeProps envelope = 102;
    // An object attached to a perspective grid plane (FX block, perspective.proto).
    PerspectiveProps perspective = 103;
    // A text block, text on a path or text in a path (TYPE block, text.proto).
    TextProps text = 130;
    // A layer under 0:4 (LIB block).
    LayerProps layer = 150;
    // A symbol under 0:7 or under a symbol folder (LIB block, symbol.proto).
    SymbolProps symbol = 151;
    // A folder of symbols under 0:7 (LIB block, symbol.proto).
    SymbolFolderProps symbol_folder = 152;
    // An instance of a symbol, on a layer (LIB block, symbol.proto).
    InstanceProps instance = 153;
    // A graphic, paragraph or character style under 0:6 (LIB block, style.proto).
    StyleProps style = 154;
    // An imported bitmap (IMG block, image.proto).
    ImageProps image = 170;
    // A placed file shown through its preview, such as EPS (IMG block, placed_file.proto).
    PlacedFileProps placed_file = 171;
    // A placed SVG animation (WEB block, svg_animation.proto).
    SvgAnimationProps svg_animation = 190;
    // A comment thread under 0:12 (COLLAB block, comments.proto).
    CommentThreadProps comment_thread = 210;
    // A glyph of a typeface document under 0:11 (FONT block, glyph.proto).
    GlyphProps glyph = 220;
    // A QR or Code 128 barcode (DATA block, barcode.proto).
    BarcodeProps barcode = 240;
    // A JavaScript script under 0:9 (DATA block, script.proto).
    ScriptProps script = 241;
    // A named view, a child of the settings node 0:1 (BASIC block, view.proto).
    CustomViewProps custom_view = 260;
    // A custom ICC profile the document carries, under `assets` (0:9) (CMS block,
    // color_management.proto).
    ProfileAssetProps profile_asset = 280;
  }
}
