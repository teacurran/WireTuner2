// proto/wiretuner/doc/v1/blend.proto
//
// The `blend` node kind (docs/_includes/effects/blends.adoc, FX-023).  A blend's live children
// are its key objects in blend order (bottom first, by sibling position) plus, when joined to a
// path, that path.  Intermediate steps are never stored: every replica derives them on read from
// the key objects and these props.
syntax = "proto3";

package wiretuner.doc.v1;

import "buf/validate/validate.proto";
import "wiretuner/doc/v1/common.proto";
import "wt/crdt/options.proto";

option java_multiple_files = true;
option java_package = "com.villagecompute.wiretuner.doc.v1";
option optimize_for = SPEED;

// How intermediate steps interpolate color.
enum BlendType {
  // Reads as NORMAL.
  BLEND_TYPE_UNSPECIFIED = 0;
  // Interpolate every attribute.
  BLEND_TYPE_NORMAL = 1;
  // Horizontal blend.
  BLEND_TYPE_HORIZONTAL = 2;
  // Vertical blend.
  BLEND_TYPE_VERTICAL = 3;
}

// How key objects are ordered for blending.
enum BlendOrder {
  // Reads as POSITIONAL.
  BLEND_ORDER_UNSPECIFIED = 0;
  // By position on the page.
  BLEND_ORDER_POSITIONAL = 1;
  // By stacking order.
  BLEND_ORDER_STACKING = 2;
}

// NodeProps.kind case `blend` (FX block).  STRUCT: every option is an independent register.
message BlendProps {
  // Name, transform and the other shared registers.
  CommonProps common = 1;
  // Intermediate steps between adjacent key objects, 1 .. 1000; 0 (never set) reads as 25.
  uint32 steps = 2 [
    (buf.validate.field).uint32 = {
      gte: 1
      lte: 1000
    },
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // Where the first step sits between the key objects, percent 0 .. 100.
  double range_first = 3 [(buf.validate.field).double = {
    gte: 0
    lte: 100
  }];
  // Where the last step sits, percent 0 .. 100; 0 (never set) reads as 100.
  double range_last = 4 [(buf.validate.field).double = {
    gte: 0
    lte: 100
  }];
  // Normal, horizontal or vertical.
  BlendType type = 5 [(buf.validate.field).enum.defined_only = true];
  // Positional or stacking order.
  BlendOrder order = 6 [(buf.validate.field).enum.defined_only = true];
  // The child node that is the path the blend follows.  Unset, deleted, not a child or not a
  // path: the blend is straight.  The path is a child so it moves, copies and deletes with the
  // blend.
  NodeRef path = 7 [(wt.crdt.field).on_dangling = REF_FALLBACK_UNSET];
  // Draw the path while blended along it.
  bool show_path = 8;
  // Rotate steps to follow the path; written true on join.
  bool rotate_on_path = 9;
  // Blend points: which point of each key object the steps start from.  One element per key
  // object; the element with the greatest id wins when two name the same object.  SEQUENCE.
  repeated BlendPoint blend_points = 10 [(wt.crdt.field).merge = MERGE_SEQUENCE];
}

// The point of one key object that blending starts from.  Element of BlendProps.blend_points.
message BlendPoint {
  // Element id (MERGE_SEQUENCE).
  ElementId id = 1;
  // A key object (a child of this blend node).  ATOMIC.
  OpId object = 2 [(wt.crdt.field).merge = MERGE_ATOMIC];
  // The contour element in that path.  ATOMIC.
  ElementId contour = 3 [(wt.crdt.field).merge = MERGE_ATOMIC];
  // The point element in that contour.  ATOMIC.
  ElementId point = 4 [(wt.crdt.field).merge = MERGE_ATOMIC];
}
