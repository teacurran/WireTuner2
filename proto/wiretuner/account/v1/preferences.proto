// proto/wiretuner/account/v1/preferences.proto
//
// Synced preferences (docs/guide/preferences.adoc, "Specification").  Not a CRDT and not
// document data: the synced categories are one map from preference id to value, merged per
// key by the server (newest `updated_at_ms` wins, receipt order on ties) and applied
// wholesale by the client.  Local categories never leave the Mac (NSUserDefaults, `wt.`
// prefix).  account.v1 carries no wt.crdt options.
//
// Preference ids are dotted, lower-case, category first: `general.pick_distance`,
// `general.smart_guides`, `object.option_drag_copies`, `text.smart_quotes_style`,
// `document.new_template`, `import.embed_images`, `export.eps_tiff_preview`,
// `spelling.ignore_uppercase`, `colors.guide_color`, `sync.undo_levels`, `sync.share_presence`.
// The client's PreferenceCatalog (BASIC-021) is the one place an id is declared; the server
// stores whatever ids it is sent, so feature epics add preferences without schema churn.
syntax = "proto3";

package wiretuner.account.v1;

import "buf/validate/validate.proto";

option java_multiple_files = true;
option java_package = "com.villagecompute.wiretuner.account.v1";
option optimize_for = SPEED;

// The synced preferences of one account: one entry per preference id.  Storing a map rather
// than typed fields keeps the schema stable while feature epics add preferences.  An unset
// id means "default", so defaults can change in later versions without rewriting stored
// preferences.  The server stores the map as one JSONB column capped at 64 KiB; the
// per-entry limits below keep any single write far under it, and the server answers
// INVALID_ARGUMENT when the merged map would exceed the cap.
message Preferences {
  // Preference id to value.  Keys are dotted lower-case ids, category first.
  map<string, PreferenceValue> values = 1 [(buf.validate.field).map = {
    max_pairs: 512
    keys: {
      string: {
        min_len: 3
        max_len: 128
        pattern: "^[a-z][a-z0-9_]*(\\.[a-z0-9_]+)+$"
      }
    }
  }];
}

// One preference's value with the provenance the per-key merge needs.
message PreferenceValue {
  // The typed value.  Exactly one case is set: a preference is restored to its default by
  // writing the default explicitly, never by sending an empty value.
  oneof value {
    option (buf.validate.oneof).required = true;
    // A switch, for example `general.smart_guides`.
    bool bool_value = 1;
    // An integer, for example `sync.undo_levels`.
    int64 int_value = 2;
    // A real number, for example `general.pick_distance` in points.
    double double_value = 3;
    // A string, for example `document.new_template`.
    string string_value = 4 [(buf.validate.field).string.max_len = 4096];
    // A color, for example `colors.guide_color`.
    PreferenceColor color_value = 5;
    // An ordered list of strings, for example default line weights or DXF options.
    StringList list_value = 6;
    // The keyboard shortcut sets, for the id `sync.shortcut_sets` only (customizing.adoc,
    // "Merge semantics"; BASIC-028).  Unlike every other case this value is merged per set by
    // the server rather than replaced whole.
    ShortcutSets shortcut_sets_value = 7;
  }
  // The client's wall-clock time of the write, in milliseconds since the Unix epoch.  The
  // server keeps, per key, the entry with the greater value; ties go to the later receipt.
  // Clock skew between one person's Macs can let an older edit win; accepted.
  int64 updated_at_ms = 10 [(buf.validate.field).int64.gt = 0];
  // The `wt-device` id of the Mac that wrote it, for the account's device list.
  string device = 11 [(buf.validate.field).string.max_len = 64];
}

// An ordered list of strings, as a preference value.
message StringList {
  // The items, in order.
  repeated string items = 1 [(buf.validate.field).repeated = {
    max_items: 256
    items: {
      string: {max_len: 1024}
    }
  }];
}

// An sRGB color with straight alpha, as a preference value (guide, grid and smart-guide
// colors).  Components are 0...1.
message PreferenceColor {
  // Red.
  double red = 1 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
  // Green.
  double green = 2 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
  // Blue.
  double blue = 3 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
  // Alpha: 0 transparent, 1 opaque.
  double alpha = 4 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
}

// The account's keyboard shortcut sets (customizing.adoc, "Data model"; BASIC-028): the value of
// `sync.shortcut_sets`.  Merged per set id, not per entry: of two versions of one set the greater
// `updated_at_ms` wins (the incoming one on ties), a deletion is a tombstone that wins the same
// way and is dropped 30 days after it was written, and `active_set_id` is newest-wins on its own
// stamp.  A client sends only the sets it changed; the server answers the merged whole.
message ShortcutSets {
  // The sets and tombstones.  At most 32 live sets exist; the rest of the room is for tombstones.
  repeated ShortcutSet sets = 1 [(buf.validate.field).repeated.max_items = 64];
  // The set in use: a user set's id or a built-in id ("builtin.wiretuner" etc.); empty when this
  // message does not carry it.
  string active_set_id = 2 [(buf.validate.field).string.max_len = 64];
  // When `active_set_id` was chosen, in milliseconds since the Unix epoch; 0 with no choice.
  int64 active_set_updated_at_ms = 3 [(buf.validate.field).int64.gte = 0];
}

// One user shortcut set, or the tombstone of a deleted one.
message ShortcutSet {
  // A UUID for user sets.
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // The name in the set pop-up; empty on a tombstone.
  string name = 2 [(buf.validate.field).string.max_len = 64];
  // The set this one was copied from: a command the set does not list takes its keys from there.
  string based_on = 3 [(buf.validate.field).string.max_len = 64];
  // Only the bindings that differ from `based_on` (an empty key list unbinds).  Replaced whole on
  // write: a set is edited in one window on one Mac at a time, and merging key bindings field by
  // field would make sets nobody composed.
  repeated Binding bindings = 4 [(buf.validate.field).repeated.max_items = 2000];
  // The client's wall-clock time of the write, in milliseconds since the Unix epoch.
  int64 updated_at_ms = 5 [(buf.validate.field).int64.gt = 0];
  // A tombstone: the set was deleted at `updated_at_ms`.
  bool deleted = 6;
}

// The keys of one command in a shortcut set.
message Binding {
  // The command registry id, for example "view.zoomIn" or "tool.pen".
  string command_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // Canonical key strings ("cmd+shift+k", "p"); the first shows in menus.
  repeated string keys = 2 [(buf.validate.field).repeated = {
    max_items: 16
    items: {
      string: {max_len: 64}
    }
  }];
}
