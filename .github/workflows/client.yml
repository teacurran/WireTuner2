name: Client

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "tools/coverage/**"
      - "tools/sonar/**"
      - ".github/workflows/client.yml"
  pull_request:
    paths:
      - "client/**"
      - "tools/coverage/**"
      - "tools/sonar/**"
      - ".github/workflows/client.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DERIVED_DATA: client/build/DerivedData
  RESULT_BUNDLE: client/build/coverage/WireTuner.xcresult

jobs:
  test:
    name: Package and app tests
    # GitHub-hosted for now.  A self-hosted Mac in the `ci` pool (docs/spec/stack.adoc, CI) may
    # replace this with `[self-hosted, macOS, ci]` once one is enrolled; nothing below assumes
    # a hosted image beyond Xcode living under /Applications.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # Newest Xcode 26 on the image, else the newest 16.x; the project needs a Swift 6 toolchain
        # and the macOS 15 SDK.
        run: |
          # Unmatched globs stay literal ("*"), so they are filtered out before sorting.
          xcode="$(printf '%s\n' /Applications/Xcode_26*.app /Applications/Xcode_16*.app | grep -v '[*]' | sort -V | tail -1)"
          test -n "$xcode" || { printf '%s\n' /Applications/Xcode*; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        # The committed project must match the spec; a drift here fails the build.
        run: |
          cd client && xcodegen generate
          git diff --exit-code --stat -- WireTuner.xcodeproj/project.pbxproj

      - name: Package tests (with coverage)
        run: |
          for package in client/Packages/*/; do
            echo "==> $package"
            (cd "$package" && swift test --enable-code-coverage)
          done

      - name: App unit and UI tests (with coverage)
        run: |
          set -o pipefail
          mkdir -p client/build/coverage
          xcodebuild test \
            -project client/WireTuner.xcodeproj -scheme WireTuner -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            | tee client/build/xcodebuild-test.log | grep -E '^(Test Suite|Test Case|\*\*|Executed|error:)'

      # Writes sonar.xml (lcov -> Sonar generic XML, lines) and regions.json (the merged
      # llvm-cov summary export the region gate reads in the sonar job).
      - name: Coverage report
        run: tools/coverage/Tests/run.sh && tools/coverage/client-coverage.sh --export-only

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-coverage
          path: |
            client/build/coverage/sonar.xml
            client/build/coverage/client.lcov
            client/build/coverage/regions.json
          if-no-files-found: error
          retention-days: 2

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-test-results
          path: |
            client/build/coverage/WireTuner.xcresult
            client/build/xcodebuild-test.log

  sonar:
    name: Coverage gate and SonarQube
    needs: test
    # macOS: the region gate is a Swift script.  sonar-scanner comes from Homebrew, the same CLI
    # `make sonar-client` runs.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # git describe for sonar.projectVersion, and blame data for new-code detection.
          fetch-depth: 0

      - name: No Sonar token in the repository
        run: tools/sonar/check-no-token.sh

      - name: Download coverage
        id: coverage
        uses: actions/download-artifact@v4
        with:
          name: client-coverage
          path: client/build/coverage

      # The client's gate (decisions.adoc D-066): 95% lines AND 95% llvm-cov regions over the
      # sources Sonar measures.  Regions stand in for branches because Swift's coverage mapping
      # has no branch records; Sonar's generic format has no field for them, so the figures go to
      # the job summary.  This step fails the job (and so blocks the PR) below either bar,
      # whatever Sonar says.
      - name: Coverage gate (95% lines and regions)
        run: tools/coverage/client-coverage.sh --gate-only

      # The `secrets` context is not allowed in `if:`, so a step decides (dissipate-server's
      # preflight).  Pull requests are uploaded only with vars.SONAR_PR_ANALYSIS=true: the server
      # is a Community Build without PR analysis, where a PR scan would overwrite main's figures.
      - name: Preflight
        id: preflight
        if: ${{ !cancelled() }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_ANALYSIS: ${{ vars.SONAR_PR_ANALYSIS }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::notice::SONAR_TOKEN secret is not set; skipping the SonarQube upload."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = pull_request ] && [ "$PR_ANALYSIS" != true ]; then
            echo "::notice::Pull-request analysis is off (vars.SONAR_PR_ANALYSIS); the coverage gate above gates this PR."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install sonar-scanner
        if: ${{ !cancelled() && steps.preflight.outputs.enabled == 'true' && steps.coverage.outcome == 'success' }}
        run: brew install sonar-scanner

      # Runs even when the coverage gate above failed, so Sonar shows the red figure rather than
      # a stale green one; the job still fails.  Settings come from client/sonar-project.properties;
      # the token reaches the scanner through the SONAR_TOKEN environment variable only.
      - name: SonarQube scan
        if: ${{ !cancelled() && steps.preflight.outputs.enabled == 'true' && steps.coverage.outcome == 'success' }}
        working-directory: client
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          test -s build/coverage/sonar.xml
          version="$(git describe --tags --always)"
          echo "Publishing analysis as sonar.projectVersion=$version"
          pr=()
          if [ "$EVENT" = pull_request ]; then
            pr=(-Dsonar.pullrequest.key="$PR_NUMBER" -Dsonar.pullrequest.branch="$PR_BRANCH" -Dsonar.pullrequest.base="$PR_BASE")
          fi
          sonar-scanner \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.projectVersion="$version" \
            "${pr[@]}"
