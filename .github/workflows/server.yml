name: Server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "proto/**"
      - "tools/coverage/jacoco-gate.sh"
      - "tools/sonar/**"
      - ".github/workflows/server.yml"
      - 'tools/protoc-gen-wtcrdt/**'
      - 'crdt-conformance/**'
  pull_request:
    paths:
      - "server/**"
      - "proto/**"
      - "tools/coverage/jacoco-gate.sh"
      - "tools/sonar/**"
      - ".github/workflows/server.yml"
      - 'tools/protoc-gen-wtcrdt/**'
      - 'crdt-conformance/**'

permissions:
  contents: read

# PR runs group by PR and cancel freely; push runs group by commit so no main run is superseded
# while queued (dissipate-server's lesson).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: mvnw verify
    # Linux, X64 on purpose: the suite starts linux/amd64 Testcontainers (Dev Services Postgres
    # and Valkey) through the runner's Docker.
    runs-on: [self-hosted, Linux, X64, ci]
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          # No `cache: maven`: the runner's ~/.m2 survives between jobs.

      - name: Set up Go and protoc (wt-crdt generates its merge table and protobuf Java)
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/protoc-gen-wtcrdt/go.mod
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker is available for Testcontainers
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "::error::Docker is not running on this runner; @QuarkusTest needs it for Dev Services."
            exit 1
          fi

      - name: Build and test
        working-directory: server
        run: ./mvnw -B -ntp verify

      # One jacoco.xml per module (wt-crdt, api, conformance); the sonar job below consumes them.
      - name: Upload coverage
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: server-jacoco
          path: server/**/target/site/jacoco/jacoco.xml
          if-no-files-found: error
          retention-days: 2

      # The coverage gate (docs/spec/testing.adoc): 95% lines and 95% branches, summed over the
      # modules.  Enforced here as well as in Sonar because the Sonar server is a Community Build
      # without pull-request analysis, so on a PR this step is the one that blocks the merge.
      - name: Coverage gate (95% lines and branches)
        run: tools/coverage/jacoco-gate.sh server/*/target/site/jacoco/jacoco.xml

  # Performance budgets (docs/spec/testing.adoc, Performance gates): the @PerfTest methods only,
  # which the verify job's default suite excludes. Each writes its figure to its module's
  # target/perf-results.md (wt-crdt and api), published below as the job summary; a budget test skips
  # itself, with the measured load, when the runner's load average is over 1.5 x its cores, so the
  # job fails only on a budget actually missed.
  perf:
    name: Performance budgets
    needs: verify
    runs-on: [self-hosted, Linux, X64, ci]
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Go and protoc (wt-crdt generates its merge table and protobuf Java)
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/protoc-gen-wtcrdt/go.mod
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker is available for Testcontainers
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "::error::Docker is not running on this runner; @QuarkusTest needs it for Dev Services."
            exit 1
          fi

      - name: Run the budgets
        working-directory: server
        run: ./mvnw -B -ntp -Pperf -pl wt-crdt,api -am verify -Dgroups=perf

      - name: Publish the measured figures
        if: always()
        run: |
          {
            echo "## Server performance budgets"
            for module in wt-crdt api; do
              report="server/$module/target/perf-results.md"
              echo
              echo "### $module"
              echo
              if [ -s "$report" ]; then
                cat "$report"
              else
                echo "No figures were recorded: the run stopped before any $module budget test ran."
              fi
            done
            echo
            echo "A skipped row means the runner's load average was over 1.5 x its cores when the test started."
          } >> "$GITHUB_STEP_SUMMARY"

  sonar:
    name: SonarQube
    needs: verify
    # Linux, X64 as for verify: a warm ~/.m2 and ~/.sonar/cache live on the pool's runners.
    runs-on: [self-hosted, Linux, X64, ci]
    timeout-minutes: 30
    # Fork guard: a self-hosted runner only runs same-repository code (and a fork's PR gets no
    # secrets anyway).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # git describe for sonar.projectVersion, and blame data for new-code detection.
          fetch-depth: 0

      - name: No Sonar token in the repository
        run: tools/sonar/check-no-token.sh

      # The `secrets` context is not allowed in `if:`, so a step decides (dissipate-server's
      # preflight).  Pull requests are analysed only when the server can keep them apart from
      # main: a Community Build has no PR analysis and would publish the PR's figures as main's.
      # Set the repository variable SONAR_PR_ANALYSIS=true once the server supports it (a
      # commercial edition or the community branch plugin); until then the PR is gated by the
      # verify job's coverage gate.
      - name: Preflight
        id: preflight
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_ANALYSIS: ${{ vars.SONAR_PR_ANALYSIS }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::notice::SONAR_TOKEN secret is not set; skipping the SonarQube upload."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = pull_request ] && [ "$PR_ANALYSIS" != true ]; then
            echo "::notice::Pull-request analysis is off (vars.SONAR_PR_ANALYSIS); the coverage gate in verify gates this PR."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 25
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Go and protoc
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/protoc-gen-wtcrdt/go.mod
      - name: Set up protoc
        if: steps.preflight.outputs.enabled == 'true'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download coverage from verify
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/download-artifact@v5
        with:
          name: server-jacoco
          path: server/

      # A scan without a jacoco.xml does not report "unknown": it publishes 0% over the real
      # figure (dissipate-server's lesson), so every module's report must be present.
      - name: Require every module's coverage report
        if: steps.preflight.outputs.enabled == 'true'
        run: |
          for module in wt-crdt api conformance; do
            xml="server/$module/target/site/jacoco/jacoco.xml"
            if [ ! -s "$xml" ]; then
              echo "::error::$xml is missing or empty; not publishing (it would replace Sonar's coverage with 0%)."
              exit 1
            fi
          done

      # test-compile only: Sonar's Java analysis needs the classes, the coverage comes from the
      # downloaded reports, and the suite is not run twice.  -Djacoco.skip keeps the agent out.
      # The token reaches the scanner through the SONAR_TOKEN environment variable, which
      # sonar-maven-plugin reads itself, so it is never on a command line.  projectKey, host,
      # report paths and exclusions come from server/pom.xml; only the derived version, the gate
      # wait and the PR parameters are flags.
      - name: SonarQube scan
        if: steps.preflight.outputs.enabled == 'true'
        working-directory: server
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          version="$(git describe --tags --always)"
          echo "Publishing analysis as sonar.projectVersion=$version"
          pr=()
          if [ "$EVENT" = pull_request ]; then
            pr=(-Dsonar.pullrequest.key="$PR_NUMBER" -Dsonar.pullrequest.branch="$PR_BRANCH" -Dsonar.pullrequest.base="$PR_BASE")
          fi
          ./mvnw -B -ntp -DskipTests -Djacoco.skip=true test-compile sonar:sonar \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.projectVersion="$version" \
            "${pr[@]}"
