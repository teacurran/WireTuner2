# WireTuner API. Profiles: %dev (quarkus:dev, on the host or in compose), %test (@QuarkusTest with
# Dev Services), %prod (packaged). Compose overrides values with QUARKUS_* environment variables
# in dissipate-server's style; the defaults below point at the compose ports on the host.

quarkus.application.name=wiretuner-api
quarkus.log.level=INFO
quarkus.log.category."com.villagecompute.wiretuner".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss} %-5p traceId=%X{traceId}, spanId=%X{spanId} [%c{2.}] (%t) %s%e%n
quarkus.shutdown.timeout=10s
quarkus.http.host=0.0.0.0

# --- Database: reactive PG client for the services, JDBC for Flyway only -------------------------
# Unset in %test so Dev Services start a Testcontainers Postgres for both URLs.
quarkus.datasource.db-kind=postgresql
# Hibernate Reactive cannot read the server version at boot; say which Postgres we target.
quarkus.datasource.db-version=17
%dev.quarkus.datasource.reactive.url=vertx-reactive:postgresql://localhost:5433/wiretuner
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/wiretuner
%prod.quarkus.datasource.reactive.url=vertx-reactive:postgresql://localhost:5433/wiretuner
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/wiretuner
quarkus.datasource.username=wiretuner
quarkus.datasource.password=wiretuner
quarkus.datasource.reactive.max-size=30
quarkus.datasource.jdbc.max-size=4
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.telemetry=false
%test.quarkus.datasource.devservices.image-name=postgres:17
# Migrations are authoritative. Compose applies them with the main-db-migrations job before the
# api starts; dev and test apply the same files at start (idempotent), prod never mutates.
quarkus.flyway.migrate-at-start=false
%dev.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.migrate-at-start=true

# --- gRPC on the HTTP server ---------------------------------------------------------------------
quarkus.grpc.server.use-separate-server=false
quarkus.grpc.server.health.enabled=true
quarkus.grpc.server.compression=gzip
# A change is at most 4 MiB encoded and travels alone when it is larger than a 1 MiB bulk frame
# (sync-protocol.adoc, Server log), so a request may be 4 MiB plus its envelope: 4 MiB + 64 KiB. The
# Vert.x gRPC server's own default (256 KiB) is far below that. ChangeRules enforces the 4 MiB change
# cap and the 1 MiB cap of a multi-change PushChanges frame itself.
quarkus.grpc.server.max-inbound-message-size=4259840
%dev.quarkus.grpc.server.reflection-service=true
# scan-for-imports=all lets protoc resolve `import "buf/validate/validate.proto"` from the
# build.buf:protovalidate jar; the jar already ships the compiled classes, so it is deliberately
# not in scan-for-proto (as dissipate-server does).
quarkus.generate-code.grpc.scan-for-imports=all
quarkus.http.idle-timeout=15M
# Long-lived Subscribe streams: keep-alive pings every 30 s are fine.
quarkus.grpc.server.netty.permit-keep-alive-time=30S
quarkus.grpc.server.netty.permit-keep-alive-without-calls=true
# The test's health client talks to the same HTTP port.
%test.quarkus.grpc.clients.health.host=localhost
%test.quarkus.grpc.clients.health.port=8081

# --- Identity: bearer tokens from Keycloak on every call ------------------------------------------
# Lazy authentication: gRPC rides the HTTP server, the bearer token is validated when the call's
# Principals.current() asks for the SecurityIdentity, and health/reflection carry no token.
quarkus.http.auth.proactive=false
# Unset in %test (an explicit value, even empty, would override the Dev Service's) so the Keycloak
# Dev Service starts and points quarkus-oidc at its own realm.
%dev.quarkus.oidc.auth-server-url=http://localhost:8180/realms/wiretuner
%prod.quarkus.oidc.auth-server-url=http://localhost:8180/realms/wiretuner
quarkus.oidc.client-id=wiretuner-mac
quarkus.oidc.application-type=service
# The realm is reachable as localhost:8180 from the host and keycloak:8080 inside compose.
quarkus.oidc.token.issuer=any
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc.connection-delay=30S
# Tests (SRV-002): the Keycloak Dev Service imports the compose realm file (relative to the api
# module, where surefire runs), whose test-only clients mint expiring and passkey-claimed tokens.
%test.quarkus.keycloak.devservices.image-name=quay.io/keycloak/keycloak:26.4
%test.quarkus.keycloak.devservices.realm-path=../keycloak/wiretuner-realm.json
%test.quarkus.keycloak.devservices.create-client=false
# The tests' gRPC clients talk to the same HTTP port as the health client.
%test.quarkus.grpc.clients.account.host=localhost
%test.quarkus.grpc.clients.account.port=8081
%test.quarkus.grpc.clients.documents.host=localhost
%test.quarkus.grpc.clients.documents.port=8081
%test.quarkus.grpc.clients.blob.host=localhost
%test.quarkus.grpc.clients.blob.port=8081
%test.quarkus.grpc.clients.team.host=localhost
%test.quarkus.grpc.clients.team.port=8081
%test.quarkus.grpc.clients.share.host=localhost
%test.quarkus.grpc.clients.share.port=8081
%test.quarkus.grpc.clients.sync.host=localhost
%test.quarkus.grpc.clients.sync.port=8081
%test.quarkus.grpc.clients.sync.max-inbound-message-size=8388608

# --- Sync (SRV-004..006): heartbeat after silence, gap wait before reading the log, live buffer ----
wt.sync.pong-after=15S
wt.sync.gap-wait=200MS
# Frames buffered for one subscription beyond what its client has taken; beyond this the stream fails
# and the client resubscribes from its applied server_seq.
wt.sync.live-buffer=4096
%test.wt.sync.pong-after=2S
# One line per accepted change at DEBUG (server.adoc, Observability) would dominate the load test.
%test.quarkus.log.category."com.villagecompute.wiretuner.api.sync".level=INFO

# --- Presence (SRV-012): 15 s expiry, at most 20 updates a second per replica, a sweep every second --
wt.presence.ttl=15S
wt.presence.interval=50MS
wt.presence.sweep=1S
# Tests: a short expiry so a crashed client's disappearance is observed quickly, and a long interval so
# coalescing is deterministic.
%test.wt.presence.ttl=3S
%test.wt.presence.interval=300MS

# --- Rate limits (SRV-014): token buckets in Valkey, per account and per document, in calls (a push
# costs one per change) per second and burst. Well above the 2,000 changes/s ingest target. -------
wt.limits.account.rate=5000
wt.limits.account.burst=20000
wt.limits.document.rate=5000
wt.limits.document.burst=20000

# --- Jobs: one node each through a Postgres advisory lock (server.adoc, Jobs) ----------------------
wt.jobs.domains.every=1h
wt.jobs.domains.delay=1m
# Tests call the jobs directly; a timer firing mid-suite would change other tests' domains.
%test.wt.jobs.domains.every=off

# --- Sign in with Apple secret rotation (SEC-004): unset locally, so the job does nothing -----------
wt.apple.team-id=${WT_APPLE_TEAM_ID:}
wt.apple.key-id=${WT_APPLE_KEY_ID:}
wt.apple.client-id=${WT_APPLE_CLIENT_ID:}
# The contents of the team's .p8 key (PKCS#8 PEM).
wt.apple.private-key=${WT_APPLE_PRIVATE_KEY:}
wt.apple.idp-alias=apple
wt.apple.secret-lifetime=180D
wt.apple.rotate-every=720h
wt.apple.rotate-delay=30s
%test.wt.apple.rotate-every=off
# The Keycloak admin API the job writes the secret through.
wt.keycloak.url=${WT_KEYCLOAK_URL:http://localhost:8180}
wt.keycloak.realm=wiretuner
wt.keycloak.admin-realm=master
wt.keycloak.admin-client-id=admin-cli
wt.keycloak.admin-username=${WT_KEYCLOAK_ADMIN_USERNAME:admin}
wt.keycloak.admin-password=${WT_KEYCLOAK_ADMIN_PASSWORD:admin}

# --- Data service (DATA-005..009; data-merge.adoc, Server) ----------------------------------------
# Master keys wrapping the credentials' data keys: comma-separated id:base64 32-byte keys, the first
# current. Production takes WT_DATA_MASTER_KEY (or a KMS-backed key); dev has a fixed throwaway key.
wt.data.master-key=${WT_DATA_MASTER_KEY:}
%dev.wt.data.master-key=${WT_DATA_MASTER_KEY:dev:ZGV2LW9ubHktbWFzdGVyLWtleS0zMi1ieXRlcy0hISE=}
# Tests: two keys, so rotation from "t1" to the current "t2" can be exercised.
%test.wt.data.master-key=t2:dGVzdC1tYXN0ZXIta2V5LXR3by0zMi1ieXRlcy0hISE=,t1:dGVzdC1tYXN0ZXIta2V5LW9uZS0zMi1ieXRlcy0hISE=
# Upstream names resolve through one resolver, as workspace domains do (tests: the DNS stub).
wt.data.dns.host=${wt.dns.host}
wt.data.dns.port=${wt.dns.port}
wt.data.dns.timeout-ms=${wt.dns.timeout-ms}
wt.data.egress.connect-timeout=10S
# Tests only (EgressStub): the stub server's certificate and its address, 127.0.0.1, which the SSRF
# guard otherwise blocks. Never set in production.
# wt.data.egress.trust-pem=
# wt.data.egress.exempt-addresses=
# Per team and per account, requests a minute and burst; concurrent calls per team and per account.
wt.data.limits.team.per-minute=600
wt.data.limits.team.burst=100
wt.data.limits.account.per-minute=120
wt.data.limits.account.burst=20
wt.data.concurrency.team=16
wt.data.concurrency.account=4
# Tests share a handful of accounts across every suite: the account bucket is lifted. The team bucket,
# fresh per test, keeps its burst of 100 and refills slowly, so the limit test's 101st request is refused
# however long the first 100 took.
%test.wt.data.limits.team.per-minute=6
%test.wt.data.limits.account.burst=1000000
%test.wt.data.limits.account.per-minute=1000000
%test.wt.data.concurrency.account=64
wt.data.max-records=100000
wt.data.audit-retention=90D
wt.jobs.credential-rotation.every=24h
wt.jobs.credential-rotation.delay=2m
wt.jobs.fetch-audit.every=24h
wt.jobs.fetch-audit.delay=5m
%test.wt.jobs.credential-rotation.every=off
%test.wt.jobs.fetch-audit.every=off
%test.quarkus.grpc.clients.data.host=localhost
%test.quarkus.grpc.clients.data.port=8081

# --- Sharing (COLLAB-011): the daily Invitations job expires stale invitations and announces links whose
# expiry ended the access they granted. Pending document invitations by email live 30 days. ---------
wt.share.invite-ttl=30D
wt.jobs.invitations.every=24h
wt.jobs.invitations.delay=3m
%test.wt.jobs.invitations.every=off
%test.quarkus.grpc.clients.library.host=localhost
%test.quarkus.grpc.clients.library.port=8081

# --- Comments (COLLAB-030/031): the digest mails mentions unseen for 10 minutes, every 5 minutes; live
# sessions are announced in Valkey for 60 s and renewed every 20 s. --------------------------------
wt.comments.digest-delay=10M
wt.jobs.comment-digest.every=5m
wt.jobs.comment-digest.delay=2m
%test.wt.jobs.comment-digest.every=off
wt.sessions.ttl=60S
wt.sessions.renew=20S
%test.quarkus.grpc.clients.comments.host=localhost
%test.quarkus.grpc.clients.comments.port=8081

# --- Publishing to a web link (WEB-012): the pub origin is a server of its own on another port, behind
# pub.<host>; the links the API hands out point there. At most 30 publishes per document per hour. -----
wt.publish.base-url=${WT_PUBLISH_BASE_URL:https://pub.wiretuner.app}
wt.publish.origin.host=0.0.0.0
wt.publish.origin.port=${WT_PUBLISH_PORT:8090}
%test.wt.publish.origin.port=8092
wt.publish.per-hour=30
%test.quarkus.grpc.clients.publish.host=localhost
%test.quarkus.grpc.clients.publish.port=8081

# --- Valkey: pub/sub fan-out and presence (unset in %test so Dev Services start one) --------------
%dev.quarkus.redis.hosts=redis://localhost:6379
%prod.quarkus.redis.hosts=redis://localhost:6379
%test.quarkus.redis.devservices.image-name=valkey/valkey:8
# Every push takes from the rate limiter's buckets as it arrives (32 pipelined per replica), and every
# presence update writes its entry: more connections than the default 6 and a deep wait queue (24).
quarkus.redis.max-pool-size=24
quarkus.redis.max-pool-waiting=8192

# --- Object storage: AWS SDK v2 S3 client, R2 in production, MinIO locally ------------------------
wt.storage.endpoint=${WT_S3_ENDPOINT:http://localhost:9300}
wt.storage.region=${WT_S3_REGION:us-east-1}
wt.storage.bucket=${WT_S3_BUCKET:wiretuner}
wt.storage.access-key=${AWS_ACCESS_KEY_ID:minioadmin}
wt.storage.secret-key=${AWS_SECRET_ACCESS_KEY:minioadmin}
wt.storage.path-style-access=${WT_S3_PATH_STYLE:true}
# Tests: a MinIO Testcontainer (MinioResource) overrides the endpoint and creates the bucket.

# --- Mail: Mailpit locally; mocked in dev and test by Quarkus ------------------------------------
quarkus.mailer.from=WireTuner <no-reply@wiretuner.local>
quarkus.mailer.host=localhost
quarkus.mailer.port=1025
# Where invitation links point: the app's accept-invite flow (SEC-003) opens /invite/<token>.
wt.links.base-url=${WT_LINKS_BASE_URL:https://wiretuner.app}

# --- Workspace domain verification: DNS TXT lookups through one resolver ------------------------
# Tests: a stub DNS server (DnsStubResource) overrides host and port.
wt.dns.host=${WT_DNS_HOST:1.1.1.1}
wt.dns.port=${WT_DNS_PORT:53}
wt.dns.timeout-ms=5000

# --- Observability ------------------------------------------------------------------------------
quarkus.otel.exporter.otlp.traces.endpoint=http://localhost:4317
%test.quarkus.otel.sdk.disabled=true
quarkus.micrometer.export.prometheus.enabled=true
# Per-RPC metrics (grpc_server_* per service and method) beside the wt_* ones (server.adoc, Observability).
quarkus.micrometer.binder.grpc-server.enabled=true
quarkus.smallrye-health.root-path=/q/health

# --- Coverage -----------------------------------------------------------------------------------
# quarkus-jacoco and the surefire JaCoCo agent share target/jacoco-quarkus.exec, rendered to
# target/site/jacoco/jacoco.xml (the path Sonar reads). Quarkus 3.39 takes the quarkus.jacoco.*
# keys only as system properties, so they are set in pom.xml (maven-surefire-plugin), not here.
