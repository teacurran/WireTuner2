# SonarQube configuration for the client (docs/spec/testing.adoc, "Coverage and SonarQube").
# Read by the sonar-scanner CLI run from client/ (`make sonar-client`, .github/workflows/client.yml);
# every path below is relative to client/.  The server uses server/pom.xml sonar.* properties
# instead, because sonar-maven-plugin ignores this file.
#
# The token is never here: local runs read SONAR_TOKEN or ~/.sonar-token, CI the SONAR_TOKEN
# secret.  sonar.qualitygate.wait and the pull-request parameters are passed on the command line
# by the caller, not set here, so a local run does not block on the gate unless asked to.

sonar.projectKey=WireTuner-Client
sonar.projectName=WireTuner Client
sonar.host.url=https://sonar.villagecompute.com
sonar.sourceEncoding=UTF-8

# Sources and tests.  sonar.sources/sonar.tests take directories, not wildcards, so the parent
# directories are listed and the inclusions pick the package Sources/ and Tests/ trees apart
# (a file may be a source or a test, never both).
sonar.sources=Packages,WTApp
sonar.inclusions=Packages/*/Sources/**,WTApp/**
sonar.tests=Packages,WTAppTests,WTAppUITests
sonar.test.inclusions=Packages/*/Tests/**,WTAppTests/**,WTAppUITests/**

# Exclusions are for generated code only (docs/spec/building.adoc): the committed protobuf and
# grpc-swift stubs and the generated CRDT schema.  Dependency checkouts live in .build/ and
# build/, which are outside the inclusions anyway.
sonar.exclusions=Packages/WTProto/Sources/WTProto/Generated/**,Packages/WTCRDT/Sources/WTCRDTSchema/Generated/**,**/.build/**

# Written by tools/coverage/client-coverage.sh (lcov -> generic coverage XML, paths relative to
# client/).  Lines only: Swift's coverage mapping has no branch records, so the branch gate is
# the llvm-cov region gate run in CI before this upload (decisions.adoc D-066).
sonar.coverageReportPaths=build/coverage/sonar.xml

# The instance has no Swift analyzer (decisions.adoc D-074), and Sonar keeps no measures for a
# file without a language, so the Swift files borrow Kotlin's suffix list: that gives them a
# language, and the generic coverage report above attaches line coverage to them.  The Kotlin
# parser rejects every Swift file ("Unable to parse file" in the scanner log, one per file), so no
# Kotlin rule runs on Swift and no issue is raised; the client has no Kotlin of its own.  Sonar
# lists the files as Kotlin and shows no lines-of-code count.  The Text language still runs the
# secrets rules over them.
sonar.kotlin.file.suffixes=.swift
sonar.text.inclusions=**/*.swift
