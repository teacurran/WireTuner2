# XcodeGen spec for the WireTuner app.  `xcodegen generate` (run from client/) rewrites
# WireTuner.xcodeproj, which is committed so the project opens without XcodeGen installed.
# Regenerate and commit the project whenever this file changes.
name: WireTuner
options:
  bundleIdPrefix: com.villagecompute
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  # A stable file/group order keeps the committed pbxproj diff small.
  groupOrdering:
    - order: [WTApp, WTAppTests, WTAppUITests, WTExtensions, Config, Packages]

configs:
  Debug: debug
  Release: release

# Signing, the version and the update feed are in the xcconfigs (Config/Project.xcconfig includes
# them) so a team id never lands in the pbxproj and the version has one source (releasing.adoc).
configFiles:
  Debug: Config/Project.xcconfig
  Release: Config/Project.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"                  # Swift 6 language mode
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    # MARKETING_VERSION and CURRENT_PROJECT_VERSION: Config/Version.xcconfig (make bump-build).
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      # Tests are built and run against Debug; without this flag no .profdata is written.
      CLANG_ENABLE_CODE_COVERAGE: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O

packages:
  WTProto:       { path: Packages/WTProto }
  WTCRDT:        { path: Packages/WTCRDT }
  WTModel:       { path: Packages/WTModel }
  WTSync:        { path: Packages/WTSync }
  WTGeometry:    { path: Packages/WTGeometry }
  WTRender:      { path: Packages/WTRender }
  WTText:        { path: Packages/WTText }
  WTInterchange: { path: Packages/WTInterchange }
  WTTestSupport: { path: Packages/WTTestSupport }
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.7.0

targets:
  WireTuner:
    type: application
    platform: macOS
    sources:
      - path: WTApp
        excludes: ["Info.plist", "WireTuner.entitlements", "Scripting/WireTuner.sdef"]
      # The scripting dictionary (DOC-026): a resource Cocoa scripting loads, not an sdef to compile.
      - path: WTApp/Scripting/WireTuner.sdef
        buildPhase: resources
      # The Quick Look extensions' package reader, compiled into the app too so its tests cover it.
      - path: WTExtensions/Shared
      # The share extension's hand-off (IMG-026): the app parses its URL and its tests cover it.
      - path: WTExtensions/Share/ShareHandoff.swift
      # The Spotlight importer's mapping (IO-035), compiled into the app so its tests cover it.
      - path: WTExtensions/Spotlight/SpotlightImport.swift
    info:
      path: WTApp/Info.plist
      properties:
        CFBundleName: WireTuner
        CFBundleDisplayName: WireTuner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.graphics-design
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Copyright 2026 Village Compute"
        NSHighResolutionCapable: true
        NSSupportsAutomaticGraphicsSwitching: true
        # Sparkle (releasing.adoc; D-080): the channel's appcast and the EdDSA public key, both
        # from Config/Distribution.xcconfig.  The key is empty except in `make release` builds,
        # and the updater starts only when it is present (AppDelegate).
        SUFeedURL: $(WT_UPDATE_FEED_URL)
        SUPublicEDKey: $(WT_SPARKLE_PUBLIC_KEY)
        SUEnableInstallerLauncherService: true
        # Sign-in and API endpoints (APP-008), from the build settings below.
        WTAuthIssuer: $(WT_AUTH_ISSUER)
        WTAPIURL: $(WT_API_URL)
        # Local mode (decisions.adoc D-079): YES runs the app without a server -- no sign-in, no
        # sync, the library on this Mac alone.  Empty endpoints above do the same.
        WTLocalMode: $(WT_LOCAL_MODE)
        # Where share links and team invitations point (the server's wt.links.base-url).
        WTLinksURL: $(WT_LINKS_URL)
        # The app group the share extension's inbox lives in (IMG-026): team-prefixed, as macOS
        # groups are, so signing needs no provisioning profile; read at run time by ShareHandoff.
        WTAppGroup: $(TeamIdentifierPrefix)com.villagecompute.wiretuner
        # wiretuner://invite/<token> opens the Join Team sheet (SEC-003); the sign-in callback
        # (wiretuner://auth/callback) is taken by ASWebAuthenticationSession before it gets here.
        # wiretuner-share://inbox/<uuid> is the share extension's hand-off (IMG-026).
        CFBundleURLTypes:
          - CFBundleURLName: com.villagecompute.wiretuner
            CFBundleURLSchemes: [wiretuner, wiretuner-share]
        # Handoff between the account's Macs (saving.adoc, "Handing a document off to another Mac";
        # IO-036): the document window's activity.  No iCloud entitlement is involved.
        NSUserActivityTypes: [com.villagecompute.wiretuner.document]
        # AppleScript (scripting.adoc; DOC-026): Cocoa scripting over the dictionary.
        NSAppleScriptEnabled: true
        OSAScriptingDefinition: WireTuner.sdef
        # The compose realm and API are plain HTTP on localhost.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # The .wiretuner package (saving.adoc, "Packages: a document as a file"; IO-005, IO-006):
        # declared here, opened from the Finder as a new document.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.villagecompute.wiretuner.package
            UTTypeDescription: WireTuner Package
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [wiretuner]
              public.mime-type: [application/vnd.villagecompute.wiretuner]
          - UTTypeIdentifier: com.villagecompute.wiretuner.colorref
            UTTypeDescription: WireTuner Color
            UTTypeConformsTo: [public.data]
          # Copied objects on the pasteboard (copying.adoc, "Client"; ClipboardPayload).
          - UTTypeIdentifier: com.villagecompute.wiretuner.objects
            UTTypeDescription: WireTuner Objects
            UTTypeConformsTo: [public.data]
          # A graphic style dragged from the Styles panel (StyleDrag) and a gradient ramp dragged
          # from the swatch rows (GradientSwatchRows).
          - UTTypeIdentifier: com.villagecompute.wiretuner.graphic-style
            UTTypeDescription: WireTuner Graphic Style
            UTTypeConformsTo: [public.data]
          - UTTypeIdentifier: com.villagecompute.wiretuner.gradient-ramp
            UTTypeDescription: WireTuner Gradient Ramp
            UTTypeConformsTo: [public.data]
          # Library rows dragged within the Library panel (SymbolLibraryDrag).
          - UTTypeIdentifier: com.villagecompute.wiretuner.library-rows
            UTTypeDescription: WireTuner Library Rows
            UTTypeConformsTo: [public.data]
          # The symbol package of copied objects, beside them on the pasteboard, and a symbol
          # library file (library.adoc, "Importing and exporting symbols"; LIB-013).
          - UTTypeIdentifier: com.villagecompute.wiretuner.symbols
            UTTypeDescription: WireTuner Symbols
            UTTypeConformsTo: [public.data]
          - UTTypeIdentifier: com.villagecompute.wiretuner.symbol-library
            UTTypeDescription: WireTuner Symbol Library
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [wtsymbols]
          # A style library file (styles.adoc, "Copying styles between documents"; LIB-022).
          - UTTypeIdentifier: com.villagecompute.wiretuner.style-library
            UTTypeDescription: WireTuner Style Library
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [wtstyles]
        # Services in (exporting.adoc, "The Share menu and Services"; IO-037): *Add to WireTuner
        # Document* takes images, PDF, SVG and text from other apps.
        NSServices:
          - NSMenuItem:
              default: Add to WireTuner Document
            NSMessage: addToDocument
            NSPortName: WireTuner
            NSSendTypes: [public.image, com.adobe.pdf, public.svg-image, public.rtf, public.utf8-plain-text]
        # A UFO font source (font-export.adoc, "UFO packages"; FONT-024): a folder
        # package no app on the Mac declares, imported here so the Open panel and the Finder know it.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.unifiedfontobject.ufo
            UTTypeDescription: UFO Font Source
            UTTypeConformsTo: [com.apple.package, public.directory]
            UTTypeTagSpecification:
              public.filename-extension: [ufo]
        CFBundleDocumentTypes:
          - CFBundleTypeName: WireTuner Package
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.villagecompute.wiretuner.package]
          # A PDF or EPS exported with *Embed WireTuner document* opens as the original (IO-028);
          # one without a package opens through the importer as a new document.
          # A symbol library opens the Import Symbols sheet over the front document (LIB-013).
          - CFBundleTypeName: WireTuner Symbol Library
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.villagecompute.wiretuner.symbol-library]
          # A style library opens the Import Styles sheet over the front document (LIB-022).
          - CFBundleTypeName: WireTuner Style Library
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.villagecompute.wiretuner.style-library]
          - CFBundleTypeName: PDF or EPS Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf, com.adobe.encapsulated-postscript]
          # A UFO opens as a typeface document (FONT-024); other font editors own the type.
          - CFBundleTypeName: UFO Font Source
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSTypeIsPackage: true
            LSItemContentTypes: [org.unifiedfontobject.ufo]
    entitlements:
      path: WTApp/WireTuner.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Chooser preferences (BASIC-022): files the user picks in an open panel, remembered
        # as app-scoped security bookmarks.  Read-write for menu:File[Export a Package…] (IO-005),
        # which writes where the save panel says.
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        # The share extension's inbox (IMG-026): the app group container both can read and write.
        # Team-prefixed: a "group." identifier would need a provisioning profile to sign at all.
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)com.villagecompute.wiretuner]
        # Sparkle's XPC services inside the sandbox (Sparkle docs, "Sandboxing").
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.villagecompute.wiretuner
        PRODUCT_NAME: WireTuner
        # The Help Book phase above (BASIC-007).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The Keycloak realm (issuer) and the API.  Defaults: the compose stack (keycloak on
        # host port 8180, api on 8080); override per configuration or on the command line.
        WT_AUTH_ISSUER: http://localhost:8180/realms/wiretuner
        WT_API_URL: http://localhost:8080
        WT_LINKS_URL: https://wiretuner.app
        # Local mode (D-079; building.adoc, "Local mode builds"): NO for Debug, which talks to the
        # compose stack; YES for Release until a server exists, so beta builds need no account.
        WT_LOCAL_MODE: NO
        GENERATE_INFOPLIST_FILE: NO
        # App only: a hardened XCUITest runner refuses to load an ad-hoc-signed test bundle
        # ("different Team IDs"), so the test targets are not hardened.
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Release:
          WT_LOCAL_MODE: YES
    # The Help Book (BASIC-007; building.adoc, "Help Book"): `make help-book` renders the guide into
    # client/build/HelpBook, and this phase copies it into Resources/HelpBook, where the Help panel
    # loads a page by slug.  Without it (a plain local build) the panel shows its catalog pages and
    # any copy left from an earlier build is removed.
    # The phase copies a folder whose files are not known when the project is generated, which a
    # sandboxed script may not read, so script sandboxing is off for this target (its only script).
    postBuildScripts:
      - name: Help Book
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/HelpBook
        script: |
          set -eu
          book="${SRCROOT}/build/HelpBook"
          dest="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/HelpBook"
          rm -rf "$dest"
          if [ -f "$book/index.html" ]; then
            mkdir -p "$dest"
            cp -R "$book/" "$dest/"
            echo "Help Book: $(ls "$dest" | wc -l | tr -d ' ') files"
          else
            echo "Help Book: none (run make help-book); the Help panel uses its catalog pages"
          fi
    dependencies:
      - package: WTProto
      - package: WTCRDT
      - package: WTModel
      - package: WTSync
      - package: WTGeometry
      - package: WTRender
      - package: WTText
      - package: WTInterchange
      - package: Sparkle
      # The Quick Look extensions (saving.adoc, "Client"; IO-034) and the share extension
      # (importing.adoc; IMG-026), embedded under PlugIns.
      - target: WireTunerThumbnail
      - target: WireTunerPreview
      - target: WireTunerShare
      # The Spotlight importer for packages on disk (saving.adoc, "Client"; IO-035).
      - target: WireTunerSpotlightImporter

  # Quick Look for .wiretuner packages (IO-034): sandboxed, no network, no WTModel; they read
  # the package's zip directory through WTExtensions/Shared/PackagePeek.swift.
  WireTunerThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - path: WTExtensions/Thumbnail
        excludes: ["Info.plist", "WireTunerThumbnail.entitlements"]
      - path: WTExtensions/Shared
    info:
      path: WTExtensions/Thumbnail/Info.plist
      properties:
        CFBundleDisplayName: WireTuner Thumbnail
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: [com.villagecompute.wiretuner.package]
            QLThumbnailMinimumDimension: 0
    entitlements:
      path: WTExtensions/Thumbnail/WireTunerThumbnail.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.villagecompute.wiretuner.thumbnail
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
    dependencies:
      - sdk: QuickLookThumbnailing.framework

  WireTunerPreview:
    type: app-extension
    platform: macOS
    sources:
      - path: WTExtensions/Preview
        excludes: ["Info.plist", "WireTunerPreview.entitlements"]
      - path: WTExtensions/Shared
    info:
      path: WTExtensions/Preview/Info.plist
      properties:
        CFBundleDisplayName: WireTuner Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes: [com.villagecompute.wiretuner.package]
            QLSupportsSearchableItems: false
    entitlements:
      path: WTExtensions/Preview/WireTunerPreview.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.villagecompute.wiretuner.preview
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
    dependencies:
      - sdk: QuickLookUI.framework

  # *Add to WireTuner Document* in the Share menu (importing.adoc, "From another app's Share menu";
  # IMG-026): sandboxed with the app group and no network, no WTModel or WTSync.  It copies the
  # shared items into the group's Inbox and hands off to the app with wiretuner-share://.
  WireTunerShare:
    type: app-extension
    platform: macOS
    sources:
      - path: WTExtensions/Share
        excludes: ["Info.plist", "WireTunerShare.entitlements"]
    info:
      path: WTExtensions/Share/Info.plist
      properties:
        CFBundleDisplayName: Add to WireTuner Document
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WTAppGroup: $(TeamIdentifierPrefix)com.villagecompute.wiretuner
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Images (SVG among them) and PDFs, as data or as files, 1 to 20 items.
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.svg-image"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf").@count BETWEEN {1, 20}).@count >= 1
    entitlements:
      path: WTExtensions/Share/WireTunerShare.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)com.villagecompute.wiretuner]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.villagecompute.wiretuner.share
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

  # Spotlight for .wiretuner packages on disk (IO-035): a CSImportExtension, sandboxed with no
  # network.  Unlike the Quick Look extensions it links WTModel: the attributes come from the
  # snapshot, decoded with the app's zstd and protobuf reader (WTModel/PackageSpotlight.swift).
  WireTunerSpotlightImporter:
    type: app-extension
    platform: macOS
    sources:
      - path: WTExtensions/Spotlight
        excludes: ["Info.plist", "WireTunerSpotlightImporter.entitlements"]
    info:
      path: WTExtensions/Spotlight/Info.plist
      properties:
        CFBundleDisplayName: WireTuner Spotlight Importer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.spotlight.import
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ImportExtension
          NSExtensionAttributes:
            CSSupportedContentTypes: [com.villagecompute.wiretuner.package]
    entitlements:
      path: WTExtensions/Spotlight/WireTunerSpotlightImporter.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.villagecompute.wiretuner.spotlight-importer
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: WTModel
      - sdk: CoreSpotlight.framework

  WireTunerTests:
    type: bundle.unit-test
    platform: macOS
    sources: [WTAppTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.villagecompute.wiretuner.tests
        GENERATE_INFOPLIST_FILE: YES
    # No package products here on purpose.  A product linked by both the app and its hosted
    # test bundle makes Xcode build every package as a dynamic "PackageProduct" framework, and
    # Xcode 26.4 then fails to schedule the link of swift-crypto's before swift-certificates'.
    # Tests reach the packages through the host app (`@testable import WireTuner`).
    dependencies:
      - target: WireTuner

  WireTunerUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [WTAppUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.villagecompute.wiretuner.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WireTuner
    dependencies:
      - target: WireTuner

schemes:
  WireTuner:
    build:
      targets:
        WireTuner: all
        WireTunerTests: [test]
        WireTunerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # Coverage for every target in the scheme (no coverageTargets list = all targets).
      gatherCoverageData: true
      targets:
        - WireTunerTests
        - WireTunerUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
